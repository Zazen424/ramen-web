; PlatformIO project configuration for the AI voice pendant.
; Target: Seeed Studio XIAO ESP32-S3 (Sense) — ESP32-S3 dual LX7, 8MB PSRAM.
;
; Build/flash:
;   pio run -t upload          # compile + flash over USB-C
;   pio device monitor         # serial console @115200
;
[env:seeed_xiao_esp32s3]
platform        = espressif32
board           = seeed_xiao_esp32s3
framework       = arduino

; ---- Serial / upload ----
monitor_speed   = 115200
upload_speed    = 921600

; ---- PSRAM (8MB) ----
; The XIAO ESP32-S3 uses OPI (octal) PSRAM. Enable it and let the heap
; allocator hand out PSRAM via ps_malloc()/heap_caps_malloc().
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3

; ---- Libraries ----
; links2004/WebSockets : WebSocket client (TEXT + BINARY frames)
; bblanchon/ArduinoJson: JSON encode/decode for the control channel
lib_deps =
    links2004/WebSockets @ ^2.4.1
    bblanchon/ArduinoJson @ ^7.0.4
